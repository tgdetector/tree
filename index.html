<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Growing Colorful Tree</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0d1117;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #canvas {
      display: block;
      background: radial-gradient(circle at bottom, #161b22 0%, #0d1117 100%);
    }

    /* Intro Overlay */
    #intro-screen {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
      transition: opacity 1s ease;
    }

    .intro-text {
      color: #f0f6fc;
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(88, 166, 255, 0.6);
      animation: pulse 1.6s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% {
        opacity: 0.3;
        transform: scale(0.96);
      }
      100% {
        opacity: 1;
        transform: scale(1.04);
      }
    }

    /* Restart Button */
    #restart-btn {
      position: absolute;
      bottom: 25px;
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.08);
      color: #c9d1d9;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.95rem;
      backdrop-filter: blur(4px);
      transition: all 0.3s ease;
    }
    #restart-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }
  </style>
</head>
<body>

  <div id="intro-screen">
    <div class="intro-text">Let's Start...</div>
  </div>

  <canvas id="canvas"></canvas>
  <button id="restart-btn" onclick="startAnimation()">Restart Growth</button>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const introScreen = document.getElementById("intro-screen");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    let branchQueue = [];
    let animationId = null;

    // Branch item definition
    function createBranch(startX, startY, length, angle, thickness, hue, depth) {
      return {
        startX,
        startY,
        currentLen: 0,
        targetLen: length,
        angle,
        thickness,
        hue,
        depth,
        isDone: false
      };
    }

    function startAnimation() {
      if (animationId) cancelAnimationFrame(animationId);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      branchQueue = [];

      // Intro animation sequence
      introScreen.style.opacity = "1";
      setTimeout(() => {
        introScreen.style.opacity = "0";

        // Initialize trunk after intro fades
        setTimeout(() => {
          const startX = canvas.width / 2;
          const startY = canvas.height - 40;
          const trunkLength = Math.min(canvas.height * 0.22, 130);
          
          branchQueue.push(
            createBranch(startX, startY, trunkLength, -Math.PI / 2, 12, 30, 0)
          );
          loop();
        }, 600);
      }, 1600);
    }

    function loop() {
      // Control branch growth rate
      const growthSpeed = 2.4; 
      let activeBranches = 0;

      for (let i = 0; i < branchQueue.length; i++) {
        const b = branchQueue[i];
        if (b.isDone) continue;

        activeBranches++;

        // Draw incremental step
        const prevX = b.startX + Math.cos(b.angle) * b.currentLen;
        const prevY = b.startY + Math.sin(b.angle) * b.currentLen;

        b.currentLen += growthSpeed;

        const nextX = b.startX + Math.cos(b.angle) * Math.min(b.currentLen, b.targetLen);
        const nextY = b.startY + Math.sin(b.angle) * Math.min(b.currentLen, b.targetLen);

        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(nextX, nextY);
        ctx.strokeStyle = `hsl(${b.hue}, 80%, 60%)`;
        ctx.lineWidth = b.thickness;
        ctx.lineCap = "round";
        ctx.stroke();

        // Branch completed -> spawn child branches
        if (b.currentLen >= b.targetLen) {
          b.isDone = true;

          // End of branch: leaves/blossoms
          if (b.depth >= 8 || b.targetLen < 12) {
            drawFlower(nextX, nextY, b.hue);
          } else {
            // Branch split parameters
            const nextDepth = b.depth + 1;
            const nextLen = b.targetLen * (0.72 + Math.random() * 0.08);
            const nextThick = Math.max(b.thickness * 0.7, 1.2);
            const hueShift = 28;

            const spread1 = 0.35 + Math.random() * 0.15;
            const spread2 = -(0.35 + Math.random() * 0.15);

            branchQueue.push(
              createBranch(nextX, nextY, nextLen, b.angle + spread1, nextThick, (b.hue + hueShift) % 360, nextDepth)
            );
            branchQueue.push(
              createBranch(nextX, nextY, nextLen, b.angle + spread2, nextThick, (b.hue + hueShift + 10) % 360, nextDepth)
            );

            // Occasional 3rd sub-branch for volume
            if (Math.random() > 0.65 && b.depth < 5) {
              branchQueue.push(
                createBranch(nextX, nextY, nextLen * 0.75, b.angle + (Math.random() - 0.5) * 0.4, nextThick, (b.hue + hueShift * 2) % 360, nextDepth)
              );
            }
          }
        }
      }

      if (activeBranches > 0) {
        animationId = requestAnimationFrame(loop);
      }
    }

    function drawFlower(x, y, hue) {
      ctx.beginPath();
      ctx.arc(x, y, 3.5 + Math.random() * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${(hue + 90) % 360}, 90%, 75%, 0.85)`;
      ctx.shadowBlur = 8;
      ctx.shadowColor = `hsl(${(hue + 90) % 360}, 90%, 75%)`;
      ctx.fill();
      ctx.shadowBlur = 0; // reset glow
    }

    // Run automatically on load
    startAnimation();
  </script>
</body>
</html>
