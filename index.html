<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You My Love Akanksha Ji ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0d1117;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #canvas {
      display: block;
      background: radial-gradient(circle at bottom, #1a162b 0%, #0a0c10 100%);
    }

    /* Intro Overlay */
    #intro-screen {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      transition: opacity 1.2s ease;
      padding: 20px;
    }

    .dedication-text {
      color: #ff79c6;
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 15px;
      letter-spacing: 1px;
      text-shadow: 0 0 15px rgba(255, 121, 198, 0.6);
      animation: fadeInDown 1.2s ease forwards;
    }

    .intro-text {
      color: #f0f6fc;
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(88, 166, 255, 0.7);
      animation: pulse 1.6s ease-in-out infinite alternate;
    }

    @keyframes fadeInDown {
      0% {
        opacity: 0;
        transform: translateY(-20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% {
        opacity: 0.5;
        transform: scale(0.96);
      }
      100% {
        opacity: 1;
        transform: scale(1.04);
      }
    }

    /* Final Message Page Overlay */
    #final-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(13, 17, 23, 0.75);
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease-in-out;
      text-align: center;
      padding: 25px;
    }

    #final-screen.show {
      opacity: 1;
      pointer-events: auto;
    }

    .love-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 121, 198, 0.3);
      padding: 40px 30px;
      border-radius: 24px;
      max-width: 600px;
      box-shadow: 0 0 35px rgba(255, 105, 180, 0.25);
      animation: popUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popUp {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .love-message {
      color: #fff;
      font-size: 2.2rem;
      line-height: 1.5;
      font-weight: 600;
      margin-bottom: 25px;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ff758c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 15px rgba(255, 117, 140, 0.3);
    }

    .btn {
      padding: 12px 28px;
      background: linear-gradient(45deg, #ff758c, #ff7eb3);
      color: #fff;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
    }

    /* Floating Little Hearts Background Effect */
    .heart {
      position: absolute;
      color: #ff4d6d;
      font-size: 20px;
      animation: floatUp 4s linear infinite;
      opacity: 0;
      z-index: 25;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.6);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-250px) scale(1.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Intro Screen -->
  <div id="intro-screen">
    <div class="dedication-text">This is for you my love Akanksha ji ❤️</div>
    <div class="intro-text">Let's Start...</div>
  </div>

  <!-- Final Page Screen -->
  <div id="final-screen">
    <div class="love-card">
      <h1 class="love-message">
        This is how you made my life beautiful baby<br>
        I love you a lot my baby 🌷❤️
      </h1>
      <button class="btn" onclick="startAnimation()">Replay with Love ✨</button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const introScreen = document.getElementById("intro-screen");
    const finalScreen = document.getElementById("final-screen");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    let branchQueue = [];
    let animationId = null;
    let heartInterval = null;

    function createBranch(startX, startY, length, angle, thickness, hue, depth) {
      return {
        startX,
        startY,
        currentLen: 0,
        targetLen: length,
        angle,
        thickness,
        hue,
        depth,
        isDone: false
      };
    }

    function spawnHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = Math.random() > 0.4 ? "❤️" : "🌷";
      heart.style.left = Math.random() * window.innerWidth + "px";
      heart.style.top = (window.innerHeight - 50) + "px";
      heart.style.fontSize = (16 + Math.random() * 20) + "px";
      heart.style.animationDuration = (3 + Math.random() * 2.5) + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 4000);
    }

    function startAnimation() {
      if (animationId) cancelAnimationFrame(animationId);
      if (heartInterval) clearInterval(heartInterval);
      
      finalScreen.classList.remove("show");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      branchQueue = [];

      // Intro Show
      introScreen.style.opacity = "1";

      setTimeout(() => {
        // Fade out intro
        introScreen.style.opacity = "0";

        setTimeout(() => {
          const startX = canvas.width / 2;
          const startY = canvas.height - 50;
          const trunkLength = Math.min(canvas.height * 0.22, 130);

          branchQueue.push(
            createBranch(startX, startY, trunkLength, -Math.PI / 2, 12, 330, 0)
          );
          loop();
        }, 700);
      }, 2500); // 2.5 seconds to read the intro
    }

    function loop() {
      const growthSpeed = 2.5; 
      let activeBranches = 0;

      for (let i = 0; i < branchQueue.length; i++) {
        const b = branchQueue[i];
        if (b.isDone) continue;

        activeBranches++;

        const prevX = b.startX + Math.cos(b.angle) * b.currentLen;
        const prevY = b.startY + Math.sin(b.angle) * b.currentLen;

        b.currentLen += growthSpeed;

        const nextX = b.startX + Math.cos(b.angle) * Math.min(b.currentLen, b.targetLen);
        const nextY = b.startY + Math.sin(b.angle) * Math.min(b.currentLen, b.targetLen);

        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(nextX, nextY);
        ctx.strokeStyle = `hsl(${b.hue}, 85%, 65%)`;
        ctx.lineWidth = b.thickness;
        ctx.lineCap = "round";
        ctx.stroke();

        if (b.currentLen >= b.targetLen) {
          b.isDone = true;

          // Blossom at ends
          if (b.depth >= 8 || b.targetLen < 14) {
            drawFlower(nextX, nextY, b.hue);
          } else {
            const nextDepth = b.depth + 1;
            const nextLen = b.targetLen * (0.72 + Math.random() * 0.08);
            const nextThick = Math.max(b.thickness * 0.7, 1.2);
            const hueShift = 25;

            const spread1 = 0.35 + Math.random() * 0.15;
            const spread2 = -(0.35 + Math.random() * 0.15);

            branchQueue.push(
              createBranch(nextX, nextY, nextLen, b.angle + spread1, nextThick, (b.hue + hueShift) % 360, nextDepth)
            );
            branchQueue.push(
              createBranch(nextX, nextY, nextLen, b.angle + spread2, nextThick, (b.hue + hueShift + 15) % 360, nextDepth)
            );

            if (Math.random() > 0.65 && b.depth < 5) {
              branchQueue.push(
                createBranch(nextX, nextY, nextLen * 0.75, b.angle + (Math.random() - 0.5) * 0.4, nextThick, (b.hue + hueShift * 2) % 360, nextDepth)
              );
            }
          }
        }
      }

      if (activeBranches > 0) {
        animationId = requestAnimationFrame(loop);
      } else {
        // Tree growth complete -> Show the final love page
        setTimeout(() => {
          finalScreen.classList.add("show");
          heartInterval = setInterval(spawnHeart, 350);
        }, 800);
      }
    }

    function drawFlower(x, y, hue) {
      ctx.beginPath();
      ctx.arc(x, y, 3.5 + Math.random() * 3, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 95%, 75%, 0.85)`;
      ctx.shadowBlur = 10;
      ctx.shadowColor = `hsl(${hue}, 90%, 75%)`;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Auto start on page load
    startAnimation();
  </script>
</body>
</html>
